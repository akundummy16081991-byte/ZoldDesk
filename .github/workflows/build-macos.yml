name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    # GitHub's macos-14 runners are Apple Silicon, matching Macs with M1 or newer.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: ./.github/actions/android-full
        with:
          keystore: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Install dependencies
        working-directory: mac
        run: npm ci

      - name: Build and verify the Apple Silicon app
        working-directory: mac
        run: |
          npm run dist:arm64
          codesign --verify --deep --strict --verbose=2 dist/TwinDesk.app
          npm run dmg

      - name: Upload the DMG and matching Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-macos-arm64
          path: |
            mac/dist/TwinDesk.dmg
            android/dist/TwinDesk-*.apk
