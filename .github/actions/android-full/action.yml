# Build both Android variants from source so desktop packages never need to fetch an APK from
# somebody else's release. Set ANDROID_KEYSTORE (base64) to keep one stable signature across CI
# runs and to install full over standard; without it Gradle uses the runner's local debug key.
name: Android source builds
inputs:
  keystore:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Signing key
      shell: bash
      env:
        KEYSTORE: ${{ inputs.keystore }}
      run: |
        if [ -z "$KEYSTORE" ]; then
          echo "::warning::No ANDROID_KEYSTORE secret: using this runner's debug key"
        else
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
        fi

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Build the standard and full APKs into android/dist
      shell: bash
      working-directory: android
      run: |
        ./gradlew --no-daemon assembleRelease
        v=$(grep -m1 versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        mkdir -p dist
        cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/ZoldDesk-$v.apk"
        cp app/build/outputs/apk/full/release/app-full-release.apk "dist/ZoldDesk-$v-full.apk"
        ls -la dist
